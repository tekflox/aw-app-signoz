# Front door for this app's single externally-reachable HTTP port
# (runtime.port in aw-app.json). Path-routes ONE port to two internal
# sidecars instead of asking the workspace framework for a second public
# port — see docs/architecture/aw-app-signoz.md "OTLP ingest exposure" for
# why: the framework's only other primitive (runtime.publish) gives a raw
# host:port with no hostname/TLS/auth, and the card asked to reuse existing
# per-app-hostname plumbing rather than invent new tunneling.
#
# OTLP/HTTP's three standard signal paths go to the otel-collector sidecar;
# everything else (the SigNoz web UI + its own API) goes to the SigNoz
# backend sidecar. Stock nginx:alpine image — this file is the only custom
# bit, mounted read-only (as a template, see below) via runtime.volumes.
#
# This app runs with the workspace's own identity gate OFF (auth_required:
# false, public: true) so SigNoz's own login/session system — not the
# workspace's — is the final word on the UI/API surface (location /). The
# OTLP paths below have no auth of their own at all, so with the workspace
# gate off they'd otherwise accept unauthenticated telemetry from the open
# internet (found live, 2026-08-30: a bare POST to /v1/traces succeeded).
# This file is the ONLY remaining auth for those three paths — it checks the
# same shared workspace API key any other `/api/apps/<slug>/...` route
# accepts (see docs/app-workspace-api-auth.md), via $signoz_api_key below.
#
# $signoz_api_key's value is NOT an nginx variable — the container's default
# nginx:alpine entrypoint runs envsubst over any file placed under
# /etc/nginx/templates/*.template (this file, mounted there — see
# aw-app.json), substituting only the env-var names actually set in the
# container's environment. AW_SIGNOZ_API_KEY is one such var (runtime.env:
# "${env.AW_WORKSPACE_API_KEY}"), so ${AW_SIGNOZ_API_KEY} below is replaced
# with the real key's literal value once, at container start — nginx's own
# $variables (like $http_x_api_key, $host) are never touched because they
# are not OS environment variable names. A regenerated workspace API key
# only takes effect on this app after its container is restarted.
server {
    listen 8080;
    client_max_body_size 32m;

    # Baked in at container start by envsubst — see the file header.
    set $signoz_api_key "${AW_SIGNOZ_API_KEY}";

    location /v1/traces {
        if ($signoz_api_key = "") { return 401; }
        if ($http_x_api_key != $signoz_api_key) { return 401; }
        proxy_pass http://aw-app-signoz-otelcol:4318/v1/traces;
        proxy_set_header Host $host;
    }

    location /v1/metrics {
        if ($signoz_api_key = "") { return 401; }
        if ($http_x_api_key != $signoz_api_key) { return 401; }
        proxy_pass http://aw-app-signoz-otelcol:4318/v1/metrics;
        proxy_set_header Host $host;
    }

    location /v1/logs {
        if ($signoz_api_key = "") { return 401; }
        if ($http_x_api_key != $signoz_api_key) { return 401; }
        proxy_pass http://aw-app-signoz-otelcol:4318/v1/logs;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://aw-app-signoz-backend:8080;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
