# Front door for this app's single externally-reachable HTTP port
# (runtime.port in aw-app.json). Path-routes ONE port to two internal
# sidecars instead of asking the workspace framework for a second public
# port — see docs/architecture/aw-app-signoz.md "OTLP ingest exposure" for
# why: the framework's only other primitive (runtime.publish) gives a raw
# host:port with no hostname/TLS/auth, and the card asked to reuse existing
# per-app-hostname plumbing rather than invent new tunneling.
#
# OTLP/HTTP's three standard signal paths go to the otel-collector sidecar;
# everything else (the SigNoz web UI + its own API) goes to the SigNoz
# backend sidecar. Stock nginx:alpine image — this file is the only custom
# bit, mounted read-only (as a template, see below) via runtime.volumes.
#
# This app runs with the workspace's own identity gate OFF (auth_required:
# false, public: true) so SigNoz's own login/session system — not the
# workspace's — is the final word on the UI/API surface (location /). The
# OTLP paths below have no auth of their own at all, so with the workspace
# gate off they'd otherwise accept unauthenticated telemetry from the open
# internet (found live, 2026-08-30: a bare POST to /v1/traces succeeded).
# This file is the ONLY remaining auth for those three paths — it checks the
# same shared workspace API key any other `/api/apps/<slug>/...` route
# accepts (see docs/app-workspace-api-auth.md), via $signoz_api_key below.
#
# $signoz_api_key's value is NOT an nginx variable — the container's default
# nginx:alpine entrypoint runs envsubst over any file placed under
# /etc/nginx/templates/*.template (this file, mounted there — see
# aw-app.json), substituting only the env-var names actually set in the
# container's environment. AW_SIGNOZ_API_KEY is one such var (runtime.env:
# "${env.AW_WORKSPACE_API_KEY}"), so ${AW_SIGNOZ_API_KEY} below is replaced
# with the real key's literal value once, at container start — nginx's own
# $variables (like $http_x_api_key, $host) are never touched because they
# are not OS environment variable names. A regenerated workspace API key
# only takes effect on this app after its container is restarted.
#
# Circuit breaker on SigNoz's own session endpoints (2026-09-02,
# bug:aw-workspace-tenant-backend-401-400-storm): SigNoz's vendored frontend
# auth interceptor (github.com/SigNoz/signoz, not in our repos, can't be
# patched here) does not fall back to /login cleanly when a session's
# refresh token is ALSO stale — POST /api/v2/sessions/rotate 400s and the
# client just keeps retrying, hammering this backend with repeated
# rotate/DELETE-sessions/authz-check calls indefinitely instead of stopping.
# A normal session recovery (expired access token, still-valid refresh
# token) is a single rotate call well under this limit; only a runaway
# retry loop trips it. This can't stop the browser tab's own loop or force
# it to /login (that needs the vendored bundle itself), but it stops that
# loop from being able to hammer the backend without bound.
limit_req_zone $binary_remote_addr zone=signoz_auth_storm:10m rate=2r/s;
limit_req_status 429;

server {
    listen 8080;
    client_max_body_size 32m;

    # Baked in at container start by envsubst — see the file header.
    set $signoz_api_key "${AW_SIGNOZ_API_KEY}";

    location /v1/traces {
        if ($signoz_api_key = "") { return 401; }
        if ($http_x_api_key != $signoz_api_key) { return 401; }
        proxy_pass http://aw-app-signoz-otelcol:4318/v1/traces;
        proxy_set_header Host $host;
    }

    location /v1/metrics {
        if ($signoz_api_key = "") { return 401; }
        if ($http_x_api_key != $signoz_api_key) { return 401; }
        proxy_pass http://aw-app-signoz-otelcol:4318/v1/metrics;
        proxy_set_header Host $host;
    }

    location /v1/logs {
        if ($signoz_api_key = "") { return 401; }
        if ($http_x_api_key != $signoz_api_key) { return 401; }
        proxy_pass http://aw-app-signoz-otelcol:4318/v1/logs;
        proxy_set_header Host $host;
    }

    location ~ ^/api/v2/sessions(/|$) {
        limit_req zone=signoz_auth_storm burst=8 nodelay;
        proxy_pass http://aw-app-signoz-backend:8080;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    location = /api/v1/authz/check {
        limit_req zone=signoz_auth_storm burst=8 nodelay;
        proxy_pass http://aw-app-signoz-backend:8080;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    # contributes.doctor reads this (see aw-app.json) — the provisioner
    # sidecar's own status.json, mounted read-only from the same
    # $AW_APP_DATA/provision volume it writes to. Must sit ABOVE location /,
    # which catches everything below and would otherwise shadow this path,
    # and needs default_type application/json explicitly: _app_doctor_checks
    # (aw-workspace src/apps/routes.py) only parses the body when the
    # response's content-type starts with application/json, otherwise it
    # reads an empty {} and reports the check as failing.
    location = /aw-provision/status.json {
        default_type application/json;
        alias /var/lib/aw-provision/status.json;
    }

    location / {
        proxy_pass http://aw-app-signoz-backend:8080;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Same incident as the circuit breaker above: when the storm outlasts
        # the rate limit anyway (a tab left open across it, or a fresh tab
        # opened mid-storm), inject a tiny watchdog into the SPA shell so the
        # tab can recover on its own instead of sitting on a blank/looping
        # screen — SigNoz's own vendored interceptor doesn't. It watches for
        # the two calls that are ONLY ever repeated in the broken path (never
        # in the normal self-heal, which is one rotate then done): a DELETE
        # to .../sessions, or a failed (>=400) POST to .../sessions/rotate.
        # 4 of either within 8s clears this origin's session keys and hard-
        # redirects to /login. Confirmed live (2026-09-02) this response
        # comes back deflate-encoded when Accept-Encoding is forwarded —
        # sub_filter can't pattern-match compressed bytes, so that's turned
        # off for this location (this app is single-tenant/low-traffic, so
        # losing gzip on the JS/CSS bundle here is a non-issue).
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter "</head>" "<script>(function(){if(location.pathname.indexOf('/login')===0){return;}var hits=[];var W=8000;var T=4;var tripped=false;function record(){var now=Date.now();hits.push(now);hits=hits.filter(function(t){return now-t<W;});if(hits.length>=T&&!tripped){tripped=true;try{localStorage.removeItem('AUTH_TOKEN');localStorage.removeItem('REFRESH_AUTH_TOKEN');localStorage.removeItem('IS_LOGGED_IN');}catch(e){}location.replace('/login');}}var open=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(method,url){this.__awM=String(method||'').toUpperCase();this.__awU=String(url||'');this.addEventListener('loadend',function(){try{var isDelete=this.__awM==='DELETE'&&this.__awU.indexOf('/sessions')!==-1;var isFailedRotate=this.__awM==='POST'&&this.__awU.indexOf('/sessions/rotate')!==-1&&this.status>=400;if(isDelete||isFailedRotate){record();}}catch(e){}});return open.apply(this,arguments);};})();</script></head>";
    }
}
