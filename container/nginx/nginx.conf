# Front door for this app's single externally-reachable HTTP port
# (runtime.port in aw-app.json). Path-routes ONE port to two internal
# sidecars instead of asking the workspace framework for a second public
# port — see docs/architecture/aw-app-signoz.md "OTLP ingest exposure" for
# why: the framework's only other primitive (runtime.publish) gives a raw
# host:port with no hostname/TLS/auth, and the card asked to reuse existing
# per-app-hostname plumbing rather than invent new tunneling.
#
# OTLP/HTTP's three standard signal paths go to the otel-collector sidecar;
# everything else (the SigNoz web UI + its own API) goes to the SigNoz
# backend sidecar. Stock nginx:alpine image — this file is the only custom
# bit, mounted read-only via runtime.volumes.
server {
    listen 8080;
    client_max_body_size 32m;

    location /v1/traces {
        proxy_pass http://aw-app-signoz-otelcol:4318/v1/traces;
        proxy_set_header Host $host;
    }

    location /v1/metrics {
        proxy_pass http://aw-app-signoz-otelcol:4318/v1/metrics;
        proxy_set_header Host $host;
    }

    location /v1/logs {
        proxy_pass http://aw-app-signoz-otelcol:4318/v1/logs;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://aw-app-signoz-backend:8080;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SigNoz's own backend hardcodes `Access-Control-Allow-Origin: *` on
        # every CORS response — cors.New(cors.Options{AllowedOrigins:
        # []string{"*"}}) in both ee/query-service/app/server.go and
        # pkg/query-service/app/server.go as of v0.128.0, no config knob.
        # This workspace's own edge separately adds
        # `Access-Control-Allow-Credentials: true` for any credentialed
        # cross-origin caller, and pairing a literal `*` with
        # `Allow-Credentials: true` is invalid per the Fetch/CORS spec — a
        # spec-compliant browser refuses to expose the response — prime
        # suspect for the post-login dashboard bounce (valid JWT issued, but
        # the follow-up authenticated call never usable; see the Kanban card
        # this fix came from). Reflect the caller's own Origin instead of the
        # wildcard, only when SigNoz actually answered with a CORS header, so
        # the pair this app ships is always spec-valid without touching
        # SigNoz's own binary.
        proxy_hide_header Access-Control-Allow-Origin;
        if ($http_origin != "") {
            add_header Access-Control-Allow-Origin $http_origin always;
        }
    }
}
